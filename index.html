<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hurmat Darbar – Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Poppins:wght@400;600;700&display=swap">
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#2a1712;--mute:#7a665d;--red:#c8281e;--gold:#e2a93b;--line:#ecdfcc;--hd:#4a0f0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c110e;--card:#291914;--ink:#f6ead9;--mute:#b9a393;--line:#40291f;--hd:#2a0907}}
:root[data-theme="dark"]{--bg:#1c110e;--card:#291914;--ink:#f6ead9;--mute:#b9a393;--line:#40291f;--hd:#2a0907}
html{scroll-padding-top:120px;color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,sans-serif;line-height:1.4}
header{background:var(--hd);color:#fff;text-align:center;padding:26px 16px 22px}
.logo{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle,#fff3d6,#e2a93b);display:flex;align-items:center;justify-content:center;font-size:42px;border:3px solid var(--gold)}
h1{font-family:'Rye',Georgia,serif;font-weight:400;font-size:30px;margin:0;color:var(--gold);letter-spacing:1px}
header p{margin:4px 0 14px;font-size:13px;opacity:.85}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.acts a{background:var(--red);color:#fff;text-decoration:none;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600}
.acts a.o{background:transparent;border:1.5px solid var(--gold);color:var(--gold)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.bar input{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:640px;margin:0 auto;padding:6px 14px 30px}
section{margin-top:22px}
h2{font-family:'Rye',Georgia,serif;font-weight:400;font-size:24px;color:var(--red);margin:0 0 4px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--red);padding-bottom:6px}
h2 span{font-size:28px}
.th{display:flex;justify-content:flex-end;gap:8px;font-size:11px;color:var(--mute);padding:6px 0 0}
.th b{width:52px;text-align:right;font-weight:600}
.it{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px dashed var(--line)}
.it .n{flex:1;font-weight:600;font-size:14.5px}
.it .p{width:52px;text-align:right;font-weight:700;font-size:15px}
.it .p.x{color:var(--mute);font-weight:400}
.it .p::before{content:"₹";font-size:11px;font-weight:400;margin-right:1px}
.it .p.x::before{content:""}
.t{flex:none;width:58px;height:58px;border-radius:12px;object-fit:cover;background:#fff;border:1px solid var(--line)}
.t.e{display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--card)}
.t{overflow:hidden}.t svg{display:block;width:100%;height:100%}
.empty{text-align:center;color:var(--mute);padding:40px 0}
footer{background:var(--hd);color:#fff;text-align:center;padding:26px 16px 34px}
footer h3{font-family:'Rye',Georgia,serif;font-weight:400;color:var(--gold);margin:0 0 4px}
footer p{margin:2px 0 12px;font-size:13px;opacity:.85}
#qr{display:inline-block;background:#fff;padding:10px;border-radius:12px;min-height:60px}
small{display:block;margin-top:14px;opacity:.6;font-size:11px}
</style>
</head>

else{const soup=/Soups/.test(cat);s+=`<ellipse cx='32' cy='38' rx='28' ry='${soup?20:17}' fill='#4a2a1e'/><ellipse cx='32' cy='36' rx='25' ry='${soup?16:13}' fill='${col}'/>`+dots(32,36,17,soup?6:8,/Veg|Wazwan|Tandoori|Snacks/.test(cat)&&!has('chicken|mutton|fish|kabab|rista|gosh|maaz')?'#f4e3a0':'#7a3318',soup?1.8:3.2)+dots(32,36,18,9,'#4f9a3c',1.4)}
return s+'</svg>'}
const em=n=>{n=n.toLowerCase();for(const [k,e] of EM)if(new RegExp(k).test(n))return e;return '🍽️'};
function render(f){
  f=(f||'').trim().toLowerCase();let out='',n=0;
  D.forEach((c,i)=>{
    const rows=c[3].split('\n').map(r=>r.split('|')).filter(r=>!f||r[0].toLowerCase().includes(f)||c[1].toLowerCase().includes(f));
    if(!rows.length)return;n++;
    out+=`<section id="c${i}"><h2><span>${c[0]}</span>${esc(c[1])}</h2>`;
    if(c[2].length)out+=`<div class="th">${c[2].map(l=>`<b>${l}</b>`).join('')}</div>`;
    rows.forEach(r=>{
      out+=`<div class="it"><div class="t">${art(c[1],r[0])}</div><div class="n">${em(r[0])} ${esc(r[0])}</div>`;
      if(c[2].length)c[2].forEach((_,k)=>{const v=r[k+1];out+=v&&v!=='-'?`<div class="p">${v}</div>`:`<div class="p x">—</div>`});
      else out+=`<div class="p">${r[1]}</div>`;
      out+='</div>';
    });
    out+='</section>';
  });
  m.innerHTML=n?out:'<div class="empty">No dishes found. Try another name.</div>';
}
ch.innerHTML=D.map((c,i)=>`<button data-i="${i}">${c[0]} ${esc(c[1])}</button>`).join('');
ch.onclick=e=>{const b=e.target.closest('button');if(!b)return;q.value='';render();
  ch.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('c'+b.dataset.i).scrollIntoView({behavior:'smooth'})};
q.oninput=()=>{ch.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));render(q.value)};
render();
try{new QRCode(document.getElementById('qr'),{text:location.href.split('#')[0],width:170,height:170})}catch(e){document.getElementById('qr').textContent='QR unavailable'}
</script>
